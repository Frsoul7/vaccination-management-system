" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="57.5" y="352.917">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114" x="68.5" y="352.917">types data (filepath)</text><polygon fill="#181818" points="61.5,384.125,51.5,388.125,61.5,392.125,57.5,388.125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="55.5" x2="408.5" y1="388.125" y2="388.125"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14" x="67.5" y="383.2686">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="85.5" y="383.2686">informs about the (in)success of the operation</text><!--MD5=[f953f17d320c8550b481ab2148c24a44]
@startuml
autonumber
actor "Coordinator" as coord

activate coord
coord -> ":System" : stars the verification of vaccination statistics

activate ":System"
":System" - -> coord : requests the required date interval (start and end dates)
deactivate ":System"

coord -> ":System" : types required information according to the data field

activate ":System"
":System" - -> coord : requests confirmation
deactivate ":System"

coord -> ":System" : confirms

activate ":System"
":System" - -> coord : shows the results and ask if want to save
deactivate ":System"

coord -> ":System" : confirms

activate ":System"
":System" - -> coord : request full path of csv file to save
deactivate ":System"

coord -> ":System" : types data (filepath)

activate ":System"
":System" - -> coord : informs about the (in)success of the operation
deactivate ":System"


@enduml

