/><line style="stroke:#181818;stroke-width:1.0;" x1="364" x2="985.5" y1="397.9375" y2="397.9375"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="371" y="393.0811">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="382" y="393.0811">add(objectDTO)</text><polygon fill="#181818" points="11,461.2891,1,465.2891,11,469.2891,7,465.2891" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="5" x2="358" y1="465.2891" y2="465.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="17" y="460.4326">8</text><a href="/US017_SD_CenterCoordinatorSelectsVaccinationCenter.puml" target="_top" title="/US017_SD_CenterCoordinatorSelectsVaccinationCenter.puml" xlink:actuate="onRequest" xlink:href="/US017_SD_CenterCoordinatorSelectsVaccinationCenter.puml" xlink:show="new" xlink:title="/US017_SD_CenterCoordinatorSelectsVaccinationCenter.puml" xlink:type="simple"><text fill="#0000FF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text-decoration="underline" textLength="138" x="28" y="460.4326">lvaccinationCentersDTO</text></a><!--MD5=[fe4084eb1a5145493529dc3bd0958afc]
@startuml
autonumber
'hide footbox

participant ":VaccinationCenterMapper" as VCMapper
participant "lvaccinationCenters: List<VaccinationCenter>" as ListVCenters
participant "lvaccinationCentersDTO : List<vaccinationCentersDTO>" as VCListDTO
participant "vaccinationCenter : VaccinationCenter" as Vcenter
participant "objectDTO : VaccinationCenterDTO" as objDTO

activate VCMapper
[o->VCMapper : [[/US017_SD_CenterCoordinatorSelectsVaccinationCenter.puml toDTO(lvaccinationCenters)]]
VCMapper- ->VCListDTO** : create()

loop for each VaccinationCenter in lvaccinationCenters
VCMapper -> ListVCenters : vaccinationCenter = getVaccinationCenter(i)
activate ListVCenters
deactivate ListVCenters

VCMapper -> Vcenter : name = getName()
activate Vcenter
deactivate Vcenter

VCMapper -> Vcenter : address = getAddress()
activate Vcenter
deactivate Vcenter

note left : continues until getting all vaccinationCenter attributes

VCMapper - -> objDTO** : create(name, address, ...)

VCMapper -> VCListDTO : add(objectDTO)
activate VCListDTO
deactivate VCListDTO

end

<- - VCMapper : [[/US017_SD_CenterCoordinatorSelectsVaccinationCenter.puml lvaccinationCentersDTO]]
deactivate VCMapper


@enduml

