-width:0.5;" width="206" x="954.5" y="266.625"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192" x="961.5" y="288.1582">objectDTO : VaccineTypeDTO</text><polygon fill="#181818" points="598,327.5859,608,331.5859,598,335.5859,602,331.5859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="147" x2="604" y1="331.5859" y2="331.5859"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="154" y="326.7295">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="165" y="326.7295">add(objectDTO)</text><polygon fill="#181818" points="11,394.9375,1,398.9375,11,402.9375,7,398.9375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="5" x2="141" y1="398.9375" y2="398.9375"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="17" y="394.0811">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80" x="28" y="394.0811">lVacTypeDTO</text><!--MD5=[6f82a27eef1e749d07db1604b38351be]
@startuml
autonumber
'hide footbox

participant ":VaccineTypeMapper" as VTMapper
participant "lVacType: List<VaccineType>" as ListVType
participant "lVacTypeDTO : List<vaccineTypeDTO>" as VTListDTO
participant "vaccineType : VaccineType" as Vtype
participant "objectDTO : VaccineTypeDTO" as objDTO

activate VTMapper
[o->VTMapper : toDTO(lVacType)
VTMapper- ->VTListDTO** : create()

loop for each VaccineType in lVacType
VTMapper -> ListVType : vaccineType = getVaccineType(i)
activate ListVType
deactivate ListVType

VTMapper-> Vtype : designation = getDesignation()
activate Vtype
deactivate Vtype

VTMapper - -> objDTO** : create(designation)

VTMapper -> VTListDTO : add(objectDTO)
activate VTListDTO
deactivate VTListDTO

end

<- - VTMapper : lVacTypeDTO
deactivate VTMapper


@enduml

