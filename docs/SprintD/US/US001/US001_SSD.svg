@startuml
autonumber
actor "SNS User" as SnsUser

activate SnsUser
SnsUser -> ":System" : starts the scheduling of a vaccine
activate ":System"
":System" - -> SnsUser : requests the required data (name, phone number, e-mail, birthdate, SNS User number,citizen card number)
deactivate ":System"

SnsUser -> ":System" : types required information according to the data fields
activate ":System"
":System" - -> SnsUser : shows the data and requests confirmation
deactivate ":System"

SnsUser -> ":System" : confirms data
activate ":System"
":System" - -> SnsUser : requests the required data (vaccine type, vaccination center, date, time, SMS confirmation)
deactivate ":System"

SnsUser -> ":System" : types and selects required information according to the data fields
activate ":System"
":System" - -> SnsUser : shows the data and requests confirmation
deactivate ":System"

SnsUser -> ":System" : confirms data
activate ":System"
":System" - -> SnsUser : informs about the success of the operation
deactivate ":System"

deactivate SnsUser

@enduml

