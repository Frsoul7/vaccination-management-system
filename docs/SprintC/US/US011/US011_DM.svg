@startuml
hide methods
skinparam classAttributeIconSize 0
left to right direction

together {


class Employee{
  -address
  -phone number
  -citizen card number
  -id
  -name
  -email
  -role
}

}

together {
class Receptionist {
}

class Nurse {
}

class "Center Coordinator" {
}
}

class Administrator {
}


Employee "1" - - "*" "Receptionist" : plays >
Employee "1" - - "*" "Nurse" : plays >
Employee "1" - - "*" "Center Coordinator" : plays >




Administrator "1" - - "*" "Employee" : registers >

@enduml

