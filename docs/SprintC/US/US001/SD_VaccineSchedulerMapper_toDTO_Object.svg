xt><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="61" x="28" y="216.417">objectDTO</text><!--MD5=[bc2660df3c0c3f87a0c4dba9f387274f]
@startuml
autonumber
'hide footbox

participant ":VaccineSchedulerMapper" as VSMapper
participant "vaccineScheduler:VaccineScheduler" as vScheduler
participant "objectDTO : VaccineSchedulerDTO" as objDTO

activate VSMapper
[o->VSMapper : toDTO(vaccineScheduler)

VSMapper -> vScheduler : snsUserNumber = getSnsUserNumber()
activate vScheduler
deactivate vScheduler

note left : continues until getting all vaccineScheduler attributes

VSMapper - -> objDTO** : create(snsUserNumber, vaccineType, ...)

<- - VSMapper : objectDTO
deactivate VSMapper

@enduml

